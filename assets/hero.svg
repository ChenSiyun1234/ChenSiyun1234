    <text x="62" y="128" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Siyun Chen</text>
    <text x="64" y="176" font-size="27" fill="#ffffff">I build things that sense, decide and move.</text>
    <text x="64" y="212" font-size="18" fill="#8fb0c8">Firmware, boards and control loops,</text>
    <text x="64" y="236" font-size="18" fill="#8fb0c8">from satellites down to a single transistor.</text>

