      .draw { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 760; stroke-dashoffset: 0; animation: draw 7s ease-out infinite; }
      .late { opacity: 1; animation: pop 7s ease-out infinite; }
      .pulse { animation: run 9s linear infinite; }
      @keyframes draw { 0%, 6% { stroke-dashoffset: 760; } 48%, 100% { stroke-dashoffset: 0; } }
      @keyframes pop { 0%, 40% { opacity: 0; } 50%, 100% { opacity: 1; } }
      @keyframes run { 0% { transform: translateX(0px); opacity: 0; } 4%, 96% { opacity: 1; }
                        100% { transform: translateX(1072px); opacity: 0; } }
    </style>
  </defs>

